name: Release to PyPI

# A `v*` tag publishes the wheels to PyPI. The GitHub release is created by hand
# on the Releases page afterwards — a tag push never touches it.
#
# `workflow_dispatch` is the escape hatch for publishing without a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
